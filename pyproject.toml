[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spilledbeans"
dynamic = ["version"]
description = "Spilled your API key on GitHub? Find it, rotate it, scrub it from git history, and stop it happening again."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mamdouh El Zein" }]
keywords = [
    "secrets", "leaked api key", "git history", "git-filter-repo", "security",
    "gitleaks", "trufflehog", "pre-commit", "credential rotation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["typer>=0.12", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
beans = "spilledbeans.cli:app"

[project.urls]
Homepage = "https://github.com/Mamdouhelzein/spilledbeans"
Issues = "https://github.com/Mamdouhelzein/spilledbeans/issues"

[tool.hatch.version]
path = "spilledbeans/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["spilledbeans", "tests", "README.md", "LICENSE", ".pre-commit-hooks.yaml"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
